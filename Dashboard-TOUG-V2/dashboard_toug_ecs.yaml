type: grid
cards:
  - show_current: true
    show_forecast: true
    type: weather-forecast
    entity: weather.eyguieres
    forecast_type: daily
  - type: custom:bubble-card
    card_type: separator
    name: Commandes ECS
    icon: mdi:tune-variant
    rows: 1
    grid_options:
      columns: 12
      rows: 0.7
    card_layout: large-2-rows
    sub_button:
      main: []
      bottom: []
  - type: custom:bubble-card
    card_type: select
    force_icon: false
    show_state: true
    show_last_changed: false
    icon: mdi:air-conditioner
    name: Mode ECS
    grid_options:
      rows: 1
    styles: |-
      :host {
         .bubble-icon {
        color: #bf8d1a !important;
        opacity: 1 !important;
      }
    scrolling_effect: true
    entity: select.toug_aquaair_mode_ecs
    sub_button:
      main:
        - entity: sensor.toug_aquaair_temperature_exterieure_exterieur_thoa
          sub_button_type: default
          show_arrow: false
          show_state: true
          icon: mdi:thermometer
          name: T° ext
          show_name: true
          scrolling_effect: false
          show_background: false
      bottom: []
  - type: custom:bubble-card
    card_type: separator
    name: Capteurs ECS
    icon: mdi:eye-outline
    grid_options:
      columns: 12
      rows: 0.7
    styles: ""
    card_layout: large-2-rows
    sub_button:
      main: []
      bottom: []
  - type: custom:bubble-card
    card_type: button
    button_type: state
    animated_icons: true
    entity: sensor.b_pac_power
    styles: |-
      :host {
          --color-ok: #bf8d1a;
          --color-background: var(--bubble-button-main-background-color, var(--bubble-main-background-color, var(--background-color-2, var(--secondary-background-color))));
          --color-notification-bubble: --color-notification-bubble: #FFFACD;
          --color-bar: var(--color-ok);
          /* Calcul de la progress % prod max de 1500 W) */
          --progress: ${Math.round((Number(state) < 1500 ? Number(state) : 1500) / 1500 * 100)}%;
        }
      .bubble-button-card-container {
        background: var(--color-background) !important;
        position: relative;
      }

      /* Barre de progression qui évolue en fonction de la prod */
      .bubble-button-card-container::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: var(--progress) !important;
        background: var(--color-bar) !important;
        z-index: 0;
      }
      .bubble-icon {
        color: #bf8d1a !important;
      }
    name: PAC + Appoint ECS Chauf Clim
    icon: mdi:air-conditioner
    sub_button:
      main:
        - entity: sensor.b_pac_power
          show_state: true
          show_icon: false
          state_background: false
          show_name: true
      bottom: []
    card_layout: large
    grid_options:
      columns: 12
    show_state: false
    scrolling_effect: false
  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        show_state: true
        show_attribute: false
        show_last_changed: false
        force_icon: false
        sub_button:
